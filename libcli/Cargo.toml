[package]
name = "tract-libcli"
version = "0.23.0-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/snipsco/tract"
keywords = ["TensorFlow", "NeuralNetworks"]
categories = ["science"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
box_drawing.workspace = true
clap.workspace = true
colorous.workspace = true
lazy_static.workspace = true
log.workspace = true
ndarray-npy = { workspace = true, optional = true }
nu-ansi-term.workspace = true
py_literal.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tract-core.workspace = true
tract-hir.workspace = true
tract-onnx = { workspace = true, optional = true }
tract-tflite.workspace = true
tract-gpu.workspace = true
tract-transformers = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tract-metal = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc.workspace = true
tract-cuda.workspace = true

[features]
default = ["transformers"]
# hir = ["tract-hir"]
hir = []
onnx = ["tract-onnx"]
complex = ["tract-core/complex"]
transformers = ["tract-transformers"]
# WORK-STEAL: ndarray-npy 0.10 on crates.io targets ndarray 0.16 and cannot
# satisfy our AdaWorldAPI/ndarray 0.17 fork's trait bounds. The npz feature
# is opt-in until ndarray-npy is updated upstream (or vendored).
npz = ["dep:ndarray-npy"]
